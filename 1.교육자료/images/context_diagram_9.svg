<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="100%" height="auto" style="max-width: 800px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 7.1: AutoReport 사내망 브라우저 로컬 완결 구조</text>
  
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="280" height="60" rx="8" fill="url(#blueCard)" stroke="#3b82f6"/>
    <text x="140" y="26" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">💻 사용자 PC 브라우저</text>
    <text x="140" y="46" fill="#cbd5e1" font-size="11" text-anchor="middle">🧩 AutoReport (Chrome Extension)</text>

    <path d="M 280 30 L 455 30" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="370" y="22" fill="#93c5fd" font-size="10" text-anchor="middle">DOM 직접 제어</text>

    <rect x="460" y="0" width="280" height="60" rx="8" fill="url(#cardBg)" stroke="#10b981"/>
    <text x="600" y="26" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">🏢 사내망 폐쇄 ERP (192.168.x.x)</text>
    <text x="600" y="46" fill="#6ee7b7" font-size="11" text-anchor="middle">외부 유출 0 Byte / 비용 0원</text>
  </g>

</svg>