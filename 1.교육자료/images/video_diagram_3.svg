<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 150" width="100%" height="auto" style="max-width: 840px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 2.1: 영상 길이 증가에 따른 Self-Attention 연산량 폭증</text>
  
  <g transform="translate(25, 45)">
    <rect x="0" y="0" width="380" height="60" rx="8" fill="url(#cardBg)" stroke="#334155"/>
    <text x="20" y="35" fill="#f8fafc" font-size="12">1초 (16프레임) ➔ N 토큰 연산 비용 1배</text>

    <rect x="410" y="0" width="380" height="60" rx="8" fill="url(#blueCard)" stroke="#ef4444"/>
    <text x="430" y="35" fill="#f87171" font-size="12" font-weight="700">5초 (80프레임) ➔ 5N 토큰 ➔ 연산 비용 25배 폭증 (O(N²))</text>
  </g>

</svg>