<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="100%" height="auto" style="max-width: 820px; font-family: Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="cardHover" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
  </defs>

  <rect width="100%" height="100%" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  
  <g transform="translate(24, 28)">
    <circle cx="5" cy="0" r="4" fill="#2563eb" />
    <text x="16" y="4" fill="#334155" font-size="13" font-weight="700">다이어그램 1.2: Context 7가지 구성 요소 묶음</text>
  </g>

  
  <g transform="translate(25, 48)">
    <rect x="0" y="0" width="500" height="170" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="20" y="24" fill="#1d4ed8" font-size="12" font-weight="700">📦 이번 요청에 실제로 전송되는 Context 7가지 구성 요소</text>
    <text x="20" y="46" fill="#334155" font-size="11">① 시스템 프롬프트 (서비스 기본 지침)</text>
    <text x="20" y="64" fill="#334155" font-size="11">② 도구(Tool) 정의 (파일읽기, 터미널 등)</text>
    <text x="20" y="82" fill="#334155" font-size="11">③ 프로젝트 규칙 문서 (AGENTS.md, CONTEXT.md)</text>
    <text x="20" y="100" fill="#334155" font-size="11">④ 지금까지의 대화 이력 (턴마다 누적 팽창)</text>
    <text x="20" y="118" fill="#334155" font-size="11">⑤ 첨부 문서 (PDF, 엑셀, 코드 파일 전문)</text>
    <text x="20" y="136" fill="#334155" font-size="11">⑥ 도구 실행 결과 (터미널 출력, 검색 결과)</text>
    <text x="20" y="154" fill="#2563eb" font-size="11" font-weight="700">⑦ 지금 내가 친 질문 ("이거 왜 안 돼?")</text>

    <path d="M 500 85 L 575 85" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="537" y="75" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">통째 전송</text>

    <rect x="585" y="45" width="185" height="80" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="677" y="82" fill="#1d4ed8" font-size="14" font-weight="700" text-anchor="middle">🧠 LLM 엔진</text>
    <text x="677" y="102" fill="#2563eb" font-size="11" text-anchor="middle">(1회성 단발 계산)</text>
  </g>

</svg>