<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="100%" height="auto" style="max-width: 800px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 1.1: 대화형 AI 서비스의 기본 계층 구조</text>
  
  <g transform="translate(30, 35)">
    <rect x="0" y="0" width="180" height="64" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>
    <text x="90" y="38" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="middle">👤 사용자</text>
    
    <path d="M 180 32 L 270 32" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="225" y="24" fill="#94a3b8" font-size="11" text-anchor="middle">질문 입력</text>

    <rect x="280" y="0" width="200" height="64" rx="10" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.5" filter="url(#dropShadow)"/>
    <text x="380" y="38" fill="#60a5fa" font-size="15" font-weight="600" text-anchor="middle">💬 웹 채팅창 (UI)</text>

    <path d="M 480 32 L 550 32" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="515" y="24" fill="#94a3b8" font-size="11" text-anchor="middle">요청 전달</text>

    <rect x="560" y="0" width="200" height="64" rx="10" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="1.5" filter="url(#dropShadow)"/>
    <text x="660" y="38" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">⚙️ LLM 추론 엔진</text>
  </g>

</svg>