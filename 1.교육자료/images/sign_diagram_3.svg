<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" width="100%" height="auto" style="max-width: 840px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 3.1: 방송 안전을 위한 인간 검수(Human-in-the-Loop) 필수 루틴</text>
  
  <g transform="translate(25, 45)">
    <rect x="0" y="0" width="230" height="65" rx="8" fill="url(#blueCard)" stroke="#3b82f6"/>
    <text x="115" y="30" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle">AI 수어 초안 생성</text>
    <text x="115" y="50" fill="#93c5fd" font-size="10" text-anchor="middle">대본 기반 사전 렌더링</text>

    <path d="M 230 32 L 285 32" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="290" y="0" width="230" height="65" rx="8" fill="url(#cardBg)" stroke="#f59e0b"/>
    <text x="405" y="30" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">👤 수어 통역사 감수 필수</text>
    <text x="405" y="50" fill="#cbd5e1" font-size="10" text-anchor="middle">오역/표정 부적절 수정</text>

    <path d="M 520 32 L 575 32" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

    <rect x="580" y="0" width="210" height="65" rx="8" fill="url(#greenGrad)" stroke="#34d399"/>
    <text x="685" y="30" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">안전한 사전 녹화 방송</text>
    <text x="685" y="50" fill="#d1fae5" font-size="10" text-anchor="middle">품질 검증 후 송출</text>
  </g>

</svg>