<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 160" width="100%" height="auto" style="max-width: 820px; font-family: Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <defs>
    <!-- Soft Gradients & Filters -->
    <filter id="softShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="cardHover" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.12"/>
    </filter>
    <!-- Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="100%" height="100%" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  
  <g transform="translate(24, 28)">
    <circle cx="5" cy="0" r="4" fill="#2563eb" />
    <text x="16" y="4" fill="#334155" font-size="13" font-weight="700">다이어그램 1.5: 도구(Function Calling) 호출과 응답 합성 흐름</text>
  </g>

  
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="170" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="85" y="28" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">1. 사용자 질문</text>
    <text x="85" y="46" fill="#64748b" font-size="10" text-anchor="middle">"오늘 서울 날씨?"</text>

    <path d="M 170 32 L 200 32" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

    <rect x="205" y="0" width="180" height="65" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="295" y="28" fill="#1d4ed8" font-size="11" font-weight="700" text-anchor="middle">2. LLM (도구 결정)</text>
    <text x="295" y="46" fill="#2563eb" font-size="10" text-anchor="middle">검색 도구 호출 지시</text>

    <path d="M 385 32 L 415 32" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

    <rect x="420" y="0" width="180" height="65" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="510" y="28" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">3. 검색 실행 결과</text>
    <text x="510" y="46" fill="#b45309" font-size="10" text-anchor="middle">"맑음, 24도" 획득</text>

    <path d="M 600 32 L 630 32" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

    <rect x="635" y="0" width="145" height="65" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="707" y="28" fill="#065f46" font-size="11" font-weight="700" text-anchor="middle">4. 최종 답변</text>
    <text x="707" y="46" fill="#059669" font-size="10" text-anchor="middle">자연스러운 문장</text>
  </g>

</svg>