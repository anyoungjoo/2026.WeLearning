<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" width="100%" height="auto" style="max-width: 840px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 1.3: 영상 한 편이 만들어지는 4단계 파이프라인</text>
  
  <g transform="translate(25, 45)">
    <rect x="0" y="0" width="180" height="70" rx="8" fill="url(#cardBg)" stroke="#334155"/>
    <text x="90" y="30" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">① VAE 인코더</text>
    <text x="90" y="50" fill="#94a3b8" font-size="10" text-anchor="middle">잠재 공간으로 압축</text>

    <path d="M 180 35 L 205 35" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="210" y="0" width="180" height="70" rx="8" fill="url(#cardBg)" stroke="#334155"/>
    <text x="300" y="30" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">② Spacetime Patch</text>
    <text x="300" y="50" fill="#94a3b8" font-size="10" text-anchor="middle">시공간 토큰화</text>

    <path d="M 390 35 L 415 35" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="420" y="0" width="180" height="70" rx="8" fill="url(#blueCard)" stroke="#3b82f6"/>
    <text x="510" y="30" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">③ DiT 디노이징</text>
    <text x="510" y="50" fill="#93c5fd" font-size="10" text-anchor="middle">공간+시간 Attention</text>

    <path d="M 600 35 L 625 35" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

    <rect x="630" y="0" width="160" height="70" rx="8" fill="url(#greenGrad)" stroke="#34d399"/>
    <text x="710" y="30" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">④ VAE 디코더</text>
    <text x="710" y="50" fill="#d1fae5" font-size="10" text-anchor="middle">고화질 픽셀 복원</text>
  </g>

</svg>