<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 190" width="100%" height="auto" style="max-width: 820px; font-family: Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="cardHover" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
  </defs>

  <rect width="100%" height="100%" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  
  <g transform="translate(24, 28)">
    <circle cx="5" cy="0" r="4" fill="#2563eb" />
    <text x="16" y="4" fill="#334155" font-size="13" font-weight="700">다이어그램 6.3: Subagent를 통한 메인 Context 오염 차단 구조</text>
  </g>

  
  <g transform="translate(25, 48)">
    <rect x="0" y="10" width="240" height="90" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="120" y="38" fill="#1d4ed8" font-size="13" font-weight="700" text-anchor="middle">🌟 Main Agent (메인 창)</text>
    <text x="120" y="60" fill="#2563eb" font-size="11" text-anchor="middle">• 아키텍처 설계 & 코드 반영</text>
    <text x="120" y="78" fill="#059669" font-size="11" font-weight="700" text-anchor="middle">• 깨끗한 Context 유지 (0% 오염)</text>

    <path d="M 240 35 L 340 35" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <rect x="345" y="0" width="240" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="465" y="24" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">🔍 Subagent 1 (파일 탐색/디버깅)</text>
    <text x="465" y="42" fill="#64748b" font-size="10" text-anchor="middle">80,000 토큰 소모 후 ➔ 3줄 요약 반환</text>

    <path d="M 240 75 L 340 75" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <rect x="345" y="60" width="240" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="465" y="84" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">🧪 Subagent 2 (테스트 실행/로그)</text>
    <text x="465" y="102" fill="#64748b" font-size="10" text-anchor="middle">방대한 로그 자체 소화 후 ➔ 결론 반환</text>
  </g>

</svg>