<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto" style="max-width: 800px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 2.1: 학습(Training)과 추론(Inference)의 2단계 분리</text>
  
  <g transform="translate(30, 45)">
    <!-- Subgraph 1: 학습 -->
    <rect x="0" y="0" width="740" height="75" rx="10" fill="url(#blueCard)" stroke="#1e40af" stroke-width="1"/>
    <text x="20" y="24" fill="#93c5fd" font-size="12" font-weight="700">🍳 1단계: 학습 (Training) — 가중치 생성 (빅테크 수행 / 수백억 소요)</text>
    <rect x="20" y="32" width="220" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="130" y="54" fill="#cbd5e1" font-size="12" text-anchor="middle">📚 방대한 텍스트 데이터</text>
    
    <path d="M 240 49 L 460 49" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="350" y="44" fill="#93c5fd" font-size="11" text-anchor="middle">GPU 수만 장 가동</text>

    <rect x="470" y="32" width="250" height="34" rx="6" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="595" y="54" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">🔒 완성된 고정 가중치 (Weight)</text>

    <!-- Subgraph 2: 추론 -->
    <rect x="0" y="95" width="740" height="75" rx="10" fill="url(#cardBg)" stroke="#059669" stroke-width="1"/>
    <text x="20" y="119" fill="#6ee7b7" font-size="12" font-weight="700">🍽️ 2단계: 추론 (Inference) — 가중치 불변 고정 계산 (우리가 쓰는 단계)</text>
    <rect x="20" y="127" width="220" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="130" y="149" fill="#cbd5e1" font-size="12" text-anchor="middle">👤 사용자 질문 입력</text>
    
    <path d="M 240 144 L 460 144" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="350" y="139" fill="#6ee7b7" font-size="11" text-anchor="middle">1회성 다음 토큰 확률 계산</text>

    <rect x="470" y="127" width="250" height="34" rx="6" fill="url(#greenGrad)" stroke="#34d399"/>
    <text x="595" y="149" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">💬 최종 답변 출력</text>
  </g>

</svg>