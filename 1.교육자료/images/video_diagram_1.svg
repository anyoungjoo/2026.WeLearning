<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 180" width="100%" height="auto" style="max-width: 840px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 1.2: LLM의 순차 생성 vs 영상 DiT의 동시 디노이징</text>
  
  <g transform="translate(25, 45)">
    <rect x="0" y="0" width="380" height="100" rx="8" fill="url(#cardBg)" stroke="#3b82f6"/>
    <text x="15" y="25" fill="#60a5fa" font-size="12" font-weight="700">[LLM] 자기회귀 (순차 생성)</text>
    <text x="15" y="55" fill="#f8fafc" font-size="11">대한민국의 ➔ 수도는 ➔ 서울 ➔ 입니다.</text>
    <text x="15" y="80" fill="#94a3b8" font-size="10">앞 글자를 보고 다음 글자를 1개씩 이어 씀 (스트리밍)</text>

    <rect x="410" y="0" width="380" height="100" rx="8" fill="url(#blueCard)" stroke="#10b981"/>
    <text x="425" y="25" fill="#34d399" font-size="12" font-weight="700">[영상 DiT] 시공간 전체 동시 디노이징</text>
    <text x="425" y="55" fill="#f8fafc" font-size="11">노이즈 ➔ 윤곽 형성 ➔ 디테일 복원 ➔ 5초 완성</text>
    <text x="425" y="80" fill="#93c5fd" font-size="10">5초 영상 전체를 한 창에 넣고 동시에 수십 번 깎아냄</text>
  </g>

</svg>