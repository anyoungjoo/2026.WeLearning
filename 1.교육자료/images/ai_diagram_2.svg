<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 160" width="100%" height="auto" style="max-width: 820px; font-family: Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <defs>
    <!-- Soft Gradients & Filters -->
    <filter id="softShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="cardHover" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.12"/>
    </filter>
    <!-- Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="100%" height="100%" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  
  <g transform="translate(24, 28)">
    <circle cx="5" cy="0" r="4" fill="#2563eb" />
    <text x="16" y="4" fill="#334155" font-size="13" font-weight="700">다이어그램 1.2: AI ➔ 머신러닝 ➔ 딥러닝 ➔ 트랜스포머 계보</text>
  </g>

  
  <g transform="translate(25, 48)">
    <rect x="0" y="0" width="140" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="70" y="37" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">1. 인공지능 (AI)</text>

    <path d="M 140 32 L 180 32" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

    <rect x="185" y="0" width="160" height="64" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="265" y="37" fill="#1d4ed8" font-size="12" font-weight="700" text-anchor="middle">2. 머신러닝 (ML)</text>

    <path d="M 345 32 L 385 32" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

    <rect x="390" y="0" width="160" height="64" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="470" y="37" fill="#7c3aed" font-size="12" font-weight="700" text-anchor="middle">3. 딥러닝 (DL)</text>

    <path d="M 550 32 L 590 32" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

    <rect x="595" y="0" width="175" height="64" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="682" y="30" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">4. 트랜스포머</text>
    <text x="682" y="48" fill="#b45309" font-size="10" font-weight="600" text-anchor="middle">➔ 초대형 LLM</text>
  </g>

</svg>