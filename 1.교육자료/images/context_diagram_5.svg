<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto" style="max-width: 800px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 5.3: RAG (검색 증강 생성) 동작 2단계 구조</text>
  
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="350" height="160" rx="8" fill="url(#cardBg)" stroke="#f59e0b"/>
    <text x="15" y="25" fill="#fbbf24" font-size="12" font-weight="700">[1. 준비 단계] 사전 문서 색인 구축</text>
    <text x="15" y="55" fill="#cbd5e1" font-size="11">📚 사내 매뉴얼 (5,000p) ➔ 500자 단위 분할</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="11">🔢 임베딩 모델 (Sentence Similarity)</text>
    <text x="15" y="115" fill="#38bdf8" font-size="11">🗄️ Vector DB에 의미 벡터 저장</text>

    <rect x="380" y="0" width="360" height="160" rx="8" fill="url(#blueCard)" stroke="#3b82f6"/>
    <text x="395" y="25" fill="#93c5fd" font-size="12" font-weight="700">[2. 질문 단계] 사용자 질의 실시간 검색</text>
    <text x="395" y="55" fill="#cbd5e1" font-size="11">👤 사용자 질문 ➔ 벡터 변환 후 Top-3 검색</text>
    <text x="395" y="85" fill="#60a5fa" font-size="11">📦 관련 조각 3개(1,500자)만 LLM Context 주입</text>
    <text x="395" y="115" fill="#34d399" font-size="11" font-weight="700">✅ 5,000배 저렴 / 정확한 답변 + 출처 제시</text>
  </g>

</svg>