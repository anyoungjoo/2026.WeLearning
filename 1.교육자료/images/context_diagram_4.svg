<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="auto" style="max-width: 800px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 4.1: AI 도구 3가지 유형과 Context 주입 주체</text>
  
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="230" height="80" rx="8" fill="url(#cardBg)" stroke="#334155"/>
    <text x="115" y="30" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">1. Chat UI (웹앱)</text>
    <text x="115" y="55" fill="#94a3b8" font-size="11" text-anchor="middle">👤 사람이 직접 복사·붙여넣기</text>

    <rect x="255" y="0" width="230" height="80" rx="8" fill="url(#cardBg)" stroke="#334155"/>
    <text x="370" y="30" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">2. CLI 도구 (터미널)</text>
    <text x="370" y="55" fill="#94a3b8" font-size="11" text-anchor="middle">🤖 AI가 파일 직접 읽기/쓰기</text>

    <rect x="510" y="0" width="230" height="80" rx="8" fill="url(#blueCard)" stroke="#3b82f6"/>
    <text x="625" y="30" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">3. Agentic IDE (통합 에디터)</text>
    <text x="625" y="55" fill="#93c5fd" font-size="11" text-anchor="middle">🤖 AI + 프로젝트 전체 자동 색인</text>
  </g>

</svg>