<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="100%" height="auto" style="max-width: 820px; font-family: Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="cardHover" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
  </defs>

  <rect width="100%" height="100%" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  
  <g transform="translate(24, 28)">
    <circle cx="5" cy="0" r="4" fill="#2563eb" />
    <text x="16" y="4" fill="#334155" font-size="13" font-weight="700">다이어그램 5.3: RAG (검색 증강 생성) 동작 2단계 구조</text>
  </g>

  
  <g transform="translate(25, 48)">
    <rect x="0" y="0" width="375" height="120" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="16" y="26" fill="#b45309" font-size="12" font-weight="700">[1. 준비 단계] 사전 문서 색인 구축</text>
    <text x="16" y="52" fill="#475569" font-size="11">📚 사내 매뉴얼 (5,000p) ➔ 500자 단위 분할</text>
    <text x="16" y="74" fill="#475569" font-size="11">🔢 임베딩 모델 (Sentence Similarity)</text>
    <text x="16" y="96" fill="#d97706" font-size="11" font-weight="700">🗄️ Vector DB에 의미 벡터 저장</text>

    <rect x="395" y="0" width="375" height="120" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="411" y="26" fill="#1d4ed8" font-size="12" font-weight="700">[2. 질문 단계] 사용자 질의 실시간 검색</text>
    <text x="411" y="52" fill="#334155" font-size="11">👤 사용자 질문 ➔ 벡터 변환 후 Top-3 검색</text>
    <text x="411" y="74" fill="#2563eb" font-size="11">📦 관련 조각 3개(1,500자)만 Context 주입</text>
    <text x="411" y="96" fill="#059669" font-size="11" font-weight="700">✅ 5,000배 저렴 / 정확한 답변 + 출처 제시</text>
  </g>

</svg>