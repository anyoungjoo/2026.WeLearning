<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="auto" style="max-width: 800px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 6.3: Subagent를 통한 메인 Context 오염 차단 구조</text>
  
  <g transform="translate(30, 45)">
    <rect x="0" y="10" width="220" height="100" rx="8" fill="url(#blueGrad)" stroke="#60a5fa"/>
    <text x="110" y="45" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">🌟 Main Agent (메인 창)</text>
    <text x="110" y="70" fill="#bfdbfe" font-size="11" text-anchor="middle">• 아키텍처 설계 & 코드 반영</text>
    <text x="110" y="90" fill="#bfdbfe" font-size="11" text-anchor="middle">• 깨끗한 Context 유지 (0% 오염)</text>

    <path d="M 220 40 L 330 40" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="340" y="0" width="220" height="60" rx="6" fill="url(#cardBg)" stroke="#334155"/>
    <text x="450" y="26" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">🔍 Subagent 1 (파일 탐색/디버깅)</text>
    <text x="450" y="46" fill="#94a3b8" font-size="10" text-anchor="middle">창 오염 80,000 토큰 소모</text>

    <path d="M 560 30 L 630 30" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <rect x="635" y="15" width="100" height="30" rx="4" fill="#047857"/>
    <text x="685" y="35" fill="#ffffff" font-size="10" text-anchor="middle">결론 3줄 전달</text>

    <path d="M 220 80 L 330 80" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="340" y="65" width="220" height="60" rx="6" fill="url(#cardBg)" stroke="#334155"/>
    <text x="450" y="91" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">🧪 Subagent 2 (테스트 실행/로그)</text>
    <text x="450" y="111" fill="#94a3b8" font-size="10" text-anchor="middle">방대한 로그 자체 창에서 소화</text>

    <path d="M 560 95 L 630 95" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <rect x="635" y="80" width="100" height="30" rx="4" fill="#047857"/>
    <text x="685" y="100" fill="#ffffff" font-size="10" text-anchor="middle">결론 2줄 전달</text>
  </g>

</svg>