<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="auto" style="max-width: 800px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 6.3: 바이브 코딩 독립 프로그램의 2단계 구조</text>
  
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="740" height="60" rx="8" fill="url(#blueCard)" stroke="#3b82f6"/>
    <text x="15" y="35" fill="#93c5fd" font-size="12" font-weight="700">🔨 1단계 개발 (AI 활용):</text>
    <text x="170" y="35" fill="#f8fafc" font-size="12">👤 나 (개발자)</text>
    <path d="M 260 30 L 390 30" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="325" y="23" fill="#93c5fd" font-size="10" text-anchor="middle">도구 개발 요청</text>
    <text x="410" y="35" fill="#60a5fa" font-size="12" font-weight="600">🤖 Claude / ChatGPT</text>
    <path d="M 550 30 L 610 30" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="625" y="35" fill="#38bdf8" font-size="12">완성 코드 전달</text>

    <rect x="0" y="75" width="740" height="60" rx="8" fill="url(#cardBg)" stroke="#10b981"/>
    <text x="15" y="110" fill="#6ee7b7" font-size="12" font-weight="700">⚡ 2단계 실행 (독립 구동):</text>
    <text x="170" y="110" fill="#f8fafc" font-size="12">💻 내 컴퓨터</text>
    <path d="M 260 105 L 390 105" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <text x="325" y="98" fill="#6ee7b7" font-size="10" text-anchor="middle">100% 로컬 연산</text>
    <text x="410" y="110" fill="#34d399" font-size="12" font-weight="600">⚙️ 완성된 자동화 프로그램</text>
    <path d="M 570 105 L 610 105" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <text x="625" y="110" fill="#4ade80" font-size="12" font-weight="700">✅ 0원 / 보안 100%</text>
  </g>

</svg>