<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 150" width="100%" height="auto" style="max-width: 820px; font-family: Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="cardHover" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
  </defs>

  <rect width="100%" height="100%" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  
  <g transform="translate(24, 28)">
    <circle cx="5" cy="0" r="4" fill="#2563eb" />
    <text x="16" y="4" fill="#334155" font-size="13" font-weight="700">다이어그램 5.6: 지식 주입 방식 결정 트리</text>
  </g>

  
  <g transform="translate(25, 48)">
    <rect x="0" y="0" width="240" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="120" y="26" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">50p 이하 소량 문서?</text>
    <text x="120" y="48" fill="#2563eb" font-size="11" text-anchor="middle">➔ 📄 Context 주입 (첨부)</text>

    <path d="M 240 32 L 275 32" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

    <rect x="280" y="0" width="240" height="65" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="400" y="26" fill="#1d4ed8" font-size="12" font-weight="700" text-anchor="middle">수천 페이지 상시 조회?</text>
    <text x="400" y="48" fill="#059669" font-size="11" font-weight="700" text-anchor="middle">➔ 🔍 RAG 구축 (Vector DB)</text>

    <path d="M 520 32 L 555 32" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

    <rect x="560" y="0" width="210" height="65" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="665" y="26" fill="#7c3aed" font-size="12" font-weight="700" text-anchor="middle">말투 / 출력 양식 고정?</text>
    <text x="665" y="48" fill="#5b21b6" font-size="11" text-anchor="middle">➔ 🧠 파인튜닝 (가중치 수정)</text>
  </g>

</svg>