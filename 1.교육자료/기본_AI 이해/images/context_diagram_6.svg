<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="auto" style="max-width: 800px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 5.6: 지식 주입 방식 결정 트리</text>
  
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="220" height="70" rx="8" fill="url(#cardBg)" stroke="#334155"/>
    <text x="110" y="32" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">50p 이하 소량 문서?</text>
    <text x="110" y="52" fill="#60a5fa" font-size="11" text-anchor="middle">➔ 📄 Context 주입 (첨부)</text>

    <path d="M 220 35 L 265 35" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="270" y="0" width="220" height="70" rx="8" fill="url(#cardBg)" stroke="#3b82f6"/>
    <text x="380" y="32" fill="#60a5fa" font-size="12" font-weight="600" text-anchor="middle">수천 페이지 상시 조회?</text>
    <text x="380" y="52" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">➔ 🔍 RAG 구축 (Vector DB)</text>

    <path d="M 490 35 L 535 35" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="540" y="0" width="200" height="70" rx="8" fill="url(#cardBg)" stroke="#8b5cf6"/>
    <text x="640" y="32" fill="#c084fc" font-size="12" font-weight="600" text-anchor="middle">말투 / 출력 양식 고정?</text>
    <text x="640" y="52" fill="#c084fc" font-size="11" text-anchor="middle">➔ 🧠 파인튜닝 (가중치 수정)</text>
  </g>

</svg>