<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 170" width="100%" height="auto" style="max-width: 840px; font-family: Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <defs>
    <!-- Soft Gradients & Filters -->
    <filter id="softShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="cardHover" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.12"/>
    </filter>
    <!-- Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="100%" height="100%" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  
  <g transform="translate(24, 28)">
    <circle cx="5" cy="0" r="4" fill="#2563eb" />
    <text x="16" y="4" fill="#334155" font-size="13" font-weight="700">다이어그램: 방송국에서 막연하게 AI 도입 시 발생하는 전형적 시행착오</text>
  </g>

  
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="180" height="85" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="90" y="28" fill="#2563eb" font-size="12" font-weight="700" text-anchor="middle">💡 1. 막연한 발의</text>
    <text x="90" y="50" fill="#334155" font-size="11" text-anchor="middle">"AI로 영상도 만든다던데</text>
    <text x="90" y="66" fill="#334155" font-size="11" text-anchor="middle">우리도 뭐 해봅시다"</text>

    <path d="M 180 42 L 205 42" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <rect x="210" y="0" width="180" height="85" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="300" y="28" fill="#d97706" font-size="12" font-weight="700" text-anchor="middle">🎬 2. 영상 AI 검토</text>
    <text x="300" y="50" fill="#334155" font-size="11" text-anchor="middle">데모는 신기하고</text>
    <text x="300" y="66" fill="#334155" font-size="11" text-anchor="middle">비주얼은 화려함</text>

    <path d="M 390 42 L 415 42" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <rect x="420" y="0" width="180" height="85" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="510" y="28" fill="#475569" font-size="12" font-weight="700" text-anchor="middle">⚠️ 3. 실무 한계 봉착</text>
    <text x="510" y="50" fill="#64748b" font-size="11" text-anchor="middle">환각·품질 통제 불가로</text>
    <text x="510" y="66" fill="#64748b" font-size="11" text-anchor="middle">방송 송출 불가</text>

    <path d="M 600 42 L 625 42" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>

    <rect x="630" y="0" width="170" height="85" rx="10" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="715" y="28" fill="#dc2626" font-size="12" font-weight="700" text-anchor="middle">💸 4. 예산 낭비 결말</text>
    <text x="715" y="50" fill="#991b1b" font-size="11" text-anchor="middle">몇 달 뒤 예산만 쓰고</text>
    <text x="715" y="66" fill="#991b1b" font-size="11" text-anchor="middle">남은 도구가 없음</text>
  </g>

</svg>