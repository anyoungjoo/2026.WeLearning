<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" width="100%" height="auto" style="max-width: 840px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 1.1: AI 개발 도구의 3세대 진화 계보</text>
  
  <g transform="translate(25, 45)">
    <rect x="0" y="0" width="240" height="75" rx="8" fill="url(#cardBg)" stroke="#334155"/>
    <text x="120" y="28" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">1세대: Chat UI</text>
    <text x="120" y="48" fill="#94a3b8" font-size="10" text-anchor="middle">• 복사 & 붙여넣기 중심</text>
    <text x="120" y="64" fill="#94a3b8" font-size="10" text-anchor="middle">• 파일 직접 수정 불가</text>

    <path d="M 240 37 L 275 37" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="280" y="0" width="240" height="75" rx="8" fill="url(#cardBg)" stroke="#334155"/>
    <text x="400" y="28" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">2세대: CLI Agent</text>
    <text x="400" y="48" fill="#94a3b8" font-size="10" text-anchor="middle">• 터미널 파일 자동 수정</text>
    <text x="400" y="64" fill="#94a3b8" font-size="10" text-anchor="middle">• 스크립트 실행 & 테스트</text>

    <path d="M 520 37 L 555 37" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <rect x="560" y="0" width="230" height="75" rx="8" fill="url(#blueCard)" stroke="#3b82f6"/>
    <text x="675" y="28" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">3세대: Agentic IDE</text>
    <text x="675" y="48" fill="#93c5fd" font-size="10" text-anchor="middle">• 에디터 전역 Context 색인</text>
    <text x="675" y="64" fill="#93c5fd" font-size="10" text-anchor="middle">• Inline Diff & 멀티에이전트</text>
  </g>

</svg>