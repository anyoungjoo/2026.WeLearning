<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto" style="max-width: 800px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 2.3: 추론 실행의 3가지 경로 비교</text>
  
  <g transform="translate(30, 45)">
    <!-- Path A -->
    <rect x="0" y="0" width="740" height="50" rx="8" fill="url(#cardBg)" stroke="#334155"/>
    <text x="15" y="30" fill="#94a3b8" font-size="12" font-weight="600">경로 A (웹 채팅):</text>
    <text x="140" y="30" fill="#f8fafc" font-size="12">👤 사람 (브라우저)</text>
    <path d="M 260 26 L 390 26" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="325" y="20" fill="#94a3b8" font-size="10" text-anchor="middle">타이핑 전송</text>
    <text x="405" y="30" fill="#60a5fa" font-size="12" font-weight="600">🌐 클라우드 서버 (OpenAI)</text>
    <path d="M 570 26 L 630 26" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="645" y="30" fill="#38bdf8" font-size="12">🖥️ 화면 표시</text>

    <!-- Path B -->
    <rect x="0" y="62" width="740" height="50" rx="8" fill="url(#blueCard)" stroke="#3b82f6"/>
    <text x="15" y="92" fill="#93c5fd" font-size="12" font-weight="600">경로 B (API 호출):</text>
    <text x="140" y="92" fill="#f8fafc" font-size="12">💻 사내 프로그램</text>
    <path d="M 260 88 L 390 88" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="325" y="82" fill="#93c5fd" font-size="10" text-anchor="middle">HTTP API 호출</text>
    <text x="405" y="92" fill="#60a5fa" font-size="12" font-weight="600">🌐 클라우드 서버 (OpenAI)</text>
    <path d="M 570 88 L 630 88" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="645" y="92" fill="#4ade80" font-size="12">📄 자동 처리 DB</text>

    <!-- Path C -->
    <rect x="0" y="124" width="740" height="50" rx="8" fill="url(#cardBg)" stroke="#10b981"/>
    <text x="15" y="154" fill="#6ee7b7" font-size="12" font-weight="600">경로 C (로컬 실행):</text>
    <text x="140" y="154" fill="#f8fafc" font-size="12">💻 사내 프로그램</text>
    <path d="M 260 150 L 390 150" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <text x="325" y="144" fill="#6ee7b7" font-size="10" text-anchor="middle">내부 연산 (외부 미전송)</text>
    <text x="405" y="154" fill="#34d399" font-size="12" font-weight="600">🔒 로컬 PC 모델 (HuggingFace)</text>
    <path d="M 620 150 L 640 150" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <text x="650" y="154" fill="#34d399" font-size="12">✅ 100% 안전</text>
  </g>

</svg>