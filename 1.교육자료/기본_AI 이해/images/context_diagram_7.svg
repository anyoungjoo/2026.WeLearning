<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 140" width="100%" height="auto" style="max-width: 820px; font-family: Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="cardHover" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
  </defs>

  <rect width="100%" height="100%" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  
  <g transform="translate(24, 28)">
    <circle cx="5" cy="0" r="4" fill="#2563eb" />
    <text x="16" y="4" fill="#334155" font-size="13" font-weight="700">다이어그램 6.2: 세션 인수인계 4단계 루틴</text>
  </g>

  
  <g transform="translate(15, 48)">
    <rect x="0" y="0" width="140" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="70" y="30" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">🚀 1. 작업 시작</text>

    <path d="M 140 25 L 165 25" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

    <rect x="170" y="0" width="140" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="240" y="30" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">💻 2. 기능 구현</text>

    <path d="M 310 25 L 335 25" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

    <rect x="340" y="0" width="145" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="412" y="30" fill="#1d4ed8" font-size="11" font-weight="700" text-anchor="middle">📝 3. HANDOVER</text>

    <path d="M 485 25 L 510 25" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

    <rect x="515" y="0" width="130" height="50" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="580" y="30" fill="#065f46" font-size="11" font-weight="700" text-anchor="middle">🔄 4. 세션 리셋</text>

    <path d="M 645 25 L 670 25" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

    <rect x="675" y="0" width="120" height="50" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
    <text x="735" y="30" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">✨ 5. 새 세션</text>
  </g>

</svg>