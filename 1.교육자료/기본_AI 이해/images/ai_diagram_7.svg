<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="auto" style="max-width: 800px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 5.1: API 호출 시퀀스 비유 (식당 주문)</text>
  
  <g transform="translate(40, 45)">
    <!-- Lifelines -->
    <rect x="20" y="0" width="140" height="36" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="90" y="23" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">👤 손님 (내 프로그램)</text>
    <line x1="90" y1="36" x2="90" y2="160" stroke="#334155" stroke-dasharray="4"/>

    <rect x="290" y="0" width="140" height="36" rx="6" fill="#1e3a8a" stroke="#3b82f6"/>
    <text x="360" y="23" fill="#60a5fa" font-size="12" font-weight="600" text-anchor="middle">🤵 점원 (API 창구)</text>
    <line x1="360" y1="36" x2="360" y2="160" stroke="#334155" stroke-dasharray="4"/>

    <rect x="560" y="0" width="140" height="36" rx="6" fill="#047857" stroke="#10b981"/>
    <text x="630" y="23" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">👨‍🍳 주방 (AI 모델)</text>
    <line x1="630" y1="36" x2="630" y2="160" stroke="#334155" stroke-dasharray="4"/>

    <!-- Messages -->
    <path d="M 90 60 L 355 60" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="225" y="54" fill="#93c5fd" font-size="11" text-anchor="middle">1. 주문서(Prompt) 전달</text>

    <path d="M 360 85 L 625 85" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="495" y="79" fill="#93c5fd" font-size="11" text-anchor="middle">2. 조리 요청 (가중치 연산)</text>

    <path d="M 630 115 L 365 115" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <text x="495" y="109" fill="#6ee7b7" font-size="11" text-anchor="middle">3. 완성 요리(답변) 반환</text>

    <path d="M 360 140 L 95 140" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <text x="225" y="134" fill="#6ee7b7" font-size="11" text-anchor="middle">4. 손님에게 전달 및 서빙</text>
  </g>

</svg>