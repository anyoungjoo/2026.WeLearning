<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" width="100%" height="auto" style="max-width: 840px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 2.2: 프레임 간 시공간 Attention 연결 구조</text>
  
  <g transform="translate(25, 45)">
    <rect x="0" y="0" width="240" height="70" rx="8" fill="url(#cardBg)" stroke="#334155"/>
    <text x="120" y="32" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">1초 프레임 패치</text>
    <text x="120" y="52" fill="#94a3b8" font-size="10" text-anchor="middle">피사체 형태 A</text>

    <path d="M 240 35 L 295 35" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="270" y="24" fill="#60a5fa" font-size="10" text-anchor="middle">시간 Attention</text>

    <rect x="300" y="0" width="240" height="70" rx="8" fill="url(#blueCard)" stroke="#3b82f6"/>
    <text x="420" y="32" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">동일 Context 공유</text>
    <text x="420" y="52" fill="#93c5fd" font-size="10" text-anchor="middle">형태 일관성 동시 계산</text>

    <path d="M 540 35 L 595 35" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="570" y="24" fill="#34d399" font-size="10" text-anchor="middle">시간 Attention</text>

    <rect x="600" y="0" width="190" height="70" rx="8" fill="url(#cardBg)" stroke="#10b981"/>
    <text x="695" y="32" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">5초 프레임 패치</text>
    <text x="695" y="52" fill="#6ee7b7" font-size="10" text-anchor="middle">피사체 형태 A 유지</text>
  </g>

</svg>