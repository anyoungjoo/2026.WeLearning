<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" width="100%" height="auto" style="max-width: 840px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 4.1: 방송 실무에서 즉시 적용 가능한 바이브 코딩 솔루션</text>
  
  <g transform="translate(25, 45)">
    <rect x="0" y="0" width="380" height="65" rx="8" fill="url(#blueCard)" stroke="#3b82f6"/>
    <text x="20" y="28" fill="#60a5fa" font-size="12" font-weight="700">⭐ 바이브 코딩으로 해결하는 영역:</text>
    <text x="20" y="50" fill="#cbd5e1" font-size="11">수어 대본 자동 맞춤법 검사, 용어 사전 연동, 편집 자동화 웹앱</text>

    <rect x="410" y="0" width="380" height="65" rx="8" fill="url(#cardBg)" stroke="#10b981"/>
    <text x="425" y="28" fill="#34d399" font-size="12" font-weight="700">✅ 실제 얻는 효과:</text>
    <text x="425" y="50" fill="#f8fafc" font-size="11">위험한 무검수 AI 송출 대신 실무 제작진의 번거로운 작업 90% 단축</text>
