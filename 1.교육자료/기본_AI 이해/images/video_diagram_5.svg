    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 3.1: 영상 생성 Context 6가지 구성 요소</text>
  
  <g transform="translate(25, 45)">
    <rect x="0" y="0" width="790" height="110" rx="8" fill="url(#cardBg)" stroke="#3b82f6"/>
    <text x="20" y="28" fill="#93c5fd" font-size="12" font-weight="700">🎬 영상 생성 Context의 6가지 핵심 구성 요소</text>
    <text x="20" y="52" fill="#cbd5e1" font-size="11">① 텍스트 프롬프트 + ② 시작/끝 참조 이미지 + ③ 시공간 3D 잠재 토큰</text>
    <text x="20" y="74" fill="#cbd5e1" font-size="11">④ 카메라 모션 제어 벡터 + ⑤ FPS 및 해상도 파라미터 + ⑥ 디노이징 스텝 수</text>
    <text x="20" y="96" fill="#34d399" font-size="11" font-weight="600">➔ 1회 5초 생성에 수만 개의 3D 시공간 토큰 동시 계산 (초고비용 원인)</text>
