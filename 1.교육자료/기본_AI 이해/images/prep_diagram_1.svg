<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%" height="auto" style="max-width: 800px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 1.1: 교육 실습 도구 및 클라우드 연동 구조</text>
  
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="url(#cardBg)" stroke="#334155"/>
    <text x="110" y="35" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">💻 로컬 실습 PC</text>

    <path d="M 220 30 L 295 30" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="255" y="22" fill="#93c5fd" font-size="10" text-anchor="middle">코드 동기화</text>

    <rect x="300" y="0" width="180" height="60" rx="8" fill="url(#blueCard)" stroke="#3b82f6"/>
    <text x="390" y="35" fill="#60a5fa" font-size="12" font-weight="600" text-anchor="middle">🐙 GitHub 원격 저장소</text>

    <path d="M 480 30 L 555 30" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="515" y="22" fill="#6ee7b7" font-size="10" text-anchor="middle">자동 배포</text>

    <rect x="560" y="0" width="180" height="60" rx="8" fill="url(#greenGrad)" stroke="#34d399"/>
    <text x="650" y="35" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">⚡ Vercel Cloud</text>
  </g>

</svg>