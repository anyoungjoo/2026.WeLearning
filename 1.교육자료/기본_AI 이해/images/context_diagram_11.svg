<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="auto" style="max-width: 800px; font-family: Pretendard, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
  <text x="24" y="32" fill="#94a3b8" font-size="13" font-weight="600">다이어그램 9.1: Vercel 무중단 자동 CI/CD 배포 파이프라인</text>
  
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="160" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="80" y="35" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">💻 1. git push</text>

    <path d="M 160 30 L 235 30" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="240" y="0" width="160" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="320" y="35" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">🐙 2. GitHub 감지</text>

    <path d="M 400 30 L 475 30" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="480" y="0" width="150" height="60" rx="8" fill="#1e3a8a" stroke="#3b82f6"/>
    <text x="555" y="35" fill="#60a5fa" font-size="12" font-weight="600" text-anchor="middle">⚡ 3. Vercel 자동빌드</text>

    <path d="M 630 30 L 665 30" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <rect x="670" y="0" width="70" height="60" rx="8" fill="url(#greenGrad)" stroke="#34d399"/>
    <text x="705" y="35" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">🎉 오픈</text>
  </g>

</svg>