<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="100%" height="auto" style="max-width: 840px; font-family: Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="centerGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  
  <g transform="translate(24, 28)">
    <circle cx="5" cy="0" r="4" fill="#2563eb" />
    <text x="16" y="4" fill="#334155" font-size="13" font-weight="700">다이어그램 1.2: AI ➔ ML ➔ DL ➔ Transformer ➔ LLM 계층적 포함 관계 (포함 구조도)</text>
  </g>

  
  <g transform="translate(25, 45)">
    <!-- 1. 가장 바깥: 인공지능 (AI) -->
    <rect x="0" y="0" width="790" height="270" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="18" y="24" fill="#334155" font-size="13" font-weight="800">🌐 1. 인공지능 (AI: Artificial Intelligence)</text>
    <text x="320" y="24" fill="#64748b" font-size="11">인간의 지적 작업을 기계로 구현하는 가장 넓은 개념 (비유: "탈것")</text>

    <!-- 2. 그 안쪽: 머신러닝 (ML) -->
    <rect x="15" y="38" width="760" height="218" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="32" y="60" fill="#1d4ed8" font-size="13" font-weight="800">⚙️ 2. 머신러닝 (ML: Machine Learning)</text>
    <text x="320" y="60" fill="#2563eb" font-size="11">데이터를 통해 규칙을 기계가 스스로 학습 (비유: "엔진이 달린 탈것")</text>

    <!-- 3. 그 안쪽: 딥러닝 (DL) -->
    <rect x="30" y="76" width="730" height="166" rx="10" fill="#f5f3ff" stroke="#c084fc" stroke-width="1.5"/>
    <text x="46" y="98" fill="#6b21a8" font-size="13" font-weight="800">🧠 3. 딥러닝 (DL: Deep Learning)</text>
    <text x="320" y="98" fill="#7c3aed" font-size="11">인간 뇌신경망을 모방하여 깊은 계층으로 학습 (비유: "내연기관 자동차")</text>

    <!-- 4. 그 안쪽: 트랜스포머 (Transformer) -->
    <rect x="45" y="114" width="700" height="114" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="60" y="136" fill="#92400e" font-size="13" font-weight="800">⚡ 4. 트랜스포머 (Transformer Architecture)</text>
    <text x="360" y="136" fill="#b45309" font-size="11">문맥 전체를 병렬 처리하는 최신 딥러닝 설계도 (비유: "특정 고성능 엔진")</text>

    <!-- 5. 가장 핵심 중심: 대규모 언어 모델 (LLM) -->
    <rect x="60" y="152" width="670" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#centerGlow)"/>
    <text x="395" y="177" fill="#1d4ed8" font-size="14" font-weight="800" text-anchor="middle">🚀 초대형 언어 모델 (LLM: Large Language Model)</text>
    <text x="395" y="198" fill="#475569" font-size="11" text-anchor="middle">트랜스포머 엔진을 초대형으로 학습시킨 결정체 (ChatGPT, Claude, Gemini 등 / 비유: "초대형 트럭")</text>
  </g>

</svg>