<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 150" width="100%" height="auto" style="max-width: 820px; font-family: Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="cardHover" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
  </defs>

  <rect width="100%" height="100%" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  
  <g transform="translate(24, 28)">
    <circle cx="5" cy="0" r="4" fill="#2563eb" />
    <text x="16" y="4" fill="#334155" font-size="13" font-weight="700">다이어그램 2.1: 수어 AI 생성 파이프라인 구조</text>
  </g>

  
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="180" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="90" y="28" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">음성/자막 텍스트</text>
    <text x="90" y="46" fill="#64748b" font-size="10" text-anchor="middle">한국어 형태소 분석</text>

    <path d="M 180 30 L 205 30" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

    <rect x="210" y="0" width="180" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="300" y="28" fill="#1d4ed8" font-size="11" font-weight="700" text-anchor="middle">수어 문법 변환 (LLM)</text>
    <text x="300" y="46" fill="#2563eb" font-size="10" text-anchor="middle">수어 어순/표정 토큰화</text>

    <path d="M 390 30 L 415 30" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

    <rect x="420" y="0" width="180" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="510" y="28" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">3D 모션 합성</text>
    <text x="510" y="46" fill="#64748b" font-size="10" text-anchor="middle">관절/키프레임</text>

    <path d="M 600 30 L 625 30" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

    <rect x="630" y="0" width="150" height="60" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="705" y="28" fill="#065f46" font-size="11" font-weight="700" text-anchor="middle">아바타 렌더링</text>
    <text x="705" y="46" fill="#059669" font-size="10" text-anchor="middle">최종 영상 송출</text>
  </g>

</svg>